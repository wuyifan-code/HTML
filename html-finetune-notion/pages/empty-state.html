<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ════════════════════════════════════════════════════════════
   Notion-style brand CSS — html-finetune-notion
   ════════════════════════════════════════════════════════════ */

@theme inline {
  --color-n-bg-base:        #ffffff;
  --color-n-bg-elevated:    #ffffff;
  --color-n-bg-subtle:      #fbfbfa;
  --color-n-bg-hover:       #f1f1f0;
  --color-n-bg-sidebar:     #f7f6f3;
  --color-n-bg-canvas:      #f7f6f3;
  --color-n-bg-inverse:     #2f3437;
  --color-n-fg-default:     #37352f;
  --color-n-fg-secondary:   #787774;
  --color-n-fg-tertiary:    #9b9a97;
  --color-n-fg-disabled:    #c4c4c2;
  --color-n-fg-link:        #2383e2;
  --color-n-fg-onbrand:     #ffffff;
  --color-n-brand:          #2383e2;
  --color-n-brand-hover:    #1a72cf;
  --color-n-brand-active:   #1761b3;
  --color-n-brand-disabled: rgba(35, 131, 226, 0.40);
  --color-n-success:        #0f7b0f;
  --color-n-warning:        #cb912f;
  --color-n-danger:         #e03e3e;
  --color-n-border-default: #e9e9e7;
  --color-n-border-strong:  #d3d3d0;
  --color-n-border-focus:   rgba(35, 131, 226, 0.40);
  --color-n-ring-focus-out: rgba(35, 131, 226, 0.40);
  --n-radius-sm: 4px;
  --n-radius-md: 5px;
  --n-radius-lg: 6px;
  --n-ease: cubic-bezier(0.165, 0.84, 0.44, 1);
  --n-duration-fast: 120ms;
  --n-duration-base: 180ms;
  --n-duration-slow: 240ms;
}

:root {
  /* surface */
  --n-bg-base:        #ffffff;
  --n-bg-elevated:    #ffffff;
  --n-bg-subtle:      #fbfbfa;
  --n-bg-hover:       #f1f1f0;
  --n-bg-sidebar:     #f7f6f3;
  --n-bg-canvas:      #f7f6f3;
  --n-bg-inverse:     #2f3437;

  /* text */
  --n-fg-default:     #37352f;
  --n-fg-secondary:   #787774;
  --n-fg-tertiary:    #9b9a97;
  --n-fg-disabled:    #c4c4c2;
  --n-fg-link:        #2383e2;
  --n-fg-onbrand:     #ffffff;

  /* brand & accent */
  --n-brand:          #2383e2;
  --n-brand-hover:    #1a72cf;
  --n-brand-active:   #1761b3;
  --n-brand-disabled: rgba(35, 131, 226, 0.40);
  --n-success:        #0f7b0f;
  --n-warning:        #cb912f;
  --n-danger:         #e03e3e;

  /* border */
  --n-border-default: #e9e9e7;
  --n-border-strong:  #d3d3d0;
  --n-border-focus:   rgba(35, 131, 226, 0.40);

  /* radius */
  --n-radius-sm: 4px;
  --n-radius-md: 5px;
  --n-radius-lg: 6px;

  /* shadow */
  --n-shadow-card:    0 1px 3px rgba(15,15,15,0.04), 0 0 0 1px rgba(15,15,15,0.04);
  --n-shadow-pop:     0 4px 12px rgba(15,15,15,0.05), 0 0 0 1px rgba(15,15,15,0.04);
  --n-shadow-overlay: 0 12px 32px rgba(15,15,15,0.14), 0 3px 8px rgba(15,15,15,0.08);
  --n-ring-focus:     0 0 0 2px var(--n-bg-base), 0 0 0 4px var(--n-border-focus);

  /* font */
  --n-font-sans: "Inter", "Inter Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --n-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* motion */
  --n-ease:           cubic-bezier(0.165, 0.84, 0.44, 1);
  --n-duration-fast:  120ms;
  --n-duration-base:  180ms;
  --n-duration-slow:  240ms;
}

.dark {
  --n-bg-base:     #191919;
  --n-bg-elevated: #202020;
  --n-bg-subtle:   #252525;
  --n-bg-sidebar:  #202020;
  --n-bg-canvas:   #2c2c2c;
  --n-bg-inverse:  #e8e8e8;
  --n-fg-default:  rgba(255, 255, 255, 0.90);
  --n-fg-secondary:rgba(255, 255, 255, 0.66);
  --n-fg-tertiary: rgba(255, 255, 255, 0.45);
  --n-fg-disabled: rgba(255, 255, 255, 0.25);
  --n-fg-link:     #4dabf7;
  --n-fg-onbrand:  #191919;
  --n-brand:          #4dabf7;
  --n-brand-hover:    #5bb8ff;
  --n-brand-active:   #3d9be6;
  --n-brand-disabled: rgba(77, 171, 247, 0.35);
  --n-success:        #4caf50;
  --n-warning:        #f5c542;
  --n-danger:         #f44336;
  --n-border-default: rgba(255, 255, 255, 0.10);
  --n-border-strong:  rgba(255, 255, 255, 0.16);
  --n-border-focus:   rgba(77, 171, 247, 0.45);
  --n-shadow-card:    0 1px 3px rgba(0,0,0,0.40);
  --n-shadow-pop:     0 6px 16px rgba(0,0,0,0.50);
  --n-shadow-overlay: 0 12px 32px rgba(0,0,0,0.60);
  --n-ring-focus:     0 0 0 2px #191919, 0 0 0 4px rgba(77,171,247,0.45);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--n-bg-base); color: var(--n-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex flex-col overflow-hidden" style="height:100vh; width:1440px; max-width:100%; margin:0 auto; background: var(--n-bg-canvas); font-family: var(--n-font-sans);">

        <!-- ═══════════ TOP BAR (56px) ═══════════ -->
        <header class="flex items-center shrink-0 border-b" style="height:56px; padding:0 16px; gap:0; border-color: var(--n-border-default); background: var(--n-bg-base);">
            <!-- Left: App icon + title -->
            <div class="flex items-center gap-2 shrink-0" style="width:280px;">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="3" width="16" height="14" rx="3" stroke="var(--n-fg-secondary)" stroke-width="1.5"/>
                    <line x1="6" y1="7" x2="14" y2="7" stroke="var(--n-fg-secondary)" stroke-width="1.2"/>
                    <line x1="6" y1="10" x2="11" y2="10" stroke="var(--n-fg-secondary)" stroke-width="1.2"/>
                    <line x1="6" y1="13" x2="13" y2="13" stroke="var(--n-fg-secondary)" stroke-width="1.2"/>
                </svg>
                <span style="font-size:14px; font-weight:600; color: var(--n-fg-default); line-height:1;">HTML FineTune</span>
            </div>

            <!-- Center: Toolbar (disabled/ghosted) -->
            <div class="flex-1 flex items-center justify-center gap-1">
                <!-- Undo (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M3 7h8a2 2 0 0 1 0 4H8" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5 3 7l2 2" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span style="color:var(--n-fg-disabled);">撤销</span>
                </button>
                <!-- Redo (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M11 7H3a2 2 0 0 0 0 4h3" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 5l2 2-2 2" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span style="color:var(--n-fg-disabled);">重做</span>
                </button>
                <!-- Separator -->
                <span style="width:1px; height:16px; background:var(--n-border-default); margin:0 4px;"></span>
                <!-- Zoom Out (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><line x1="9.5" y1="9.5" x2="12.5" y2="12.5" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/><line x1="4" y1="6" x2="8" y2="6" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
                <!-- Zoom Level (disabled) -->
                <span style="font-size:12px; font-weight:500; color:var(--n-fg-disabled); min-width:44px; text-align:center; opacity:0.6;">100%</span>
                <!-- Zoom In (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><line x1="9.5" y1="9.5" x2="12.5" y2="12.5" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/><line x1="4" y1="6" x2="8" y2="6" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/><line x1="6" y1="4" x2="6" y2="8" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
                <!-- Separator -->
                <span style="width:1px; height:16px; background:var(--n-border-default); margin:0 4px;"></span>
                <!-- Fit (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><rect x="1.5" y="1.5" width="11" height="11" rx="1" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><path d="M1.5 1.5l3 3M12.5 1.5l-3 3M1.5 12.5l3-3M12.5 12.5l-3-3" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/></svg>
                    <span style="color:var(--n-fg-disabled);">适应</span>
                </button>
                <!-- Theme Toggle (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><circle cx="7" cy="7" r="3.5" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.05 2.05l1.06 1.06M10.89 10.89l1.06 1.06M2.05 11.95l1.06-1.06M10.89 3.11l1.06-1.06" stroke="var(--n-fg-disabled)" stroke-width="1" stroke-linecap="round"/></svg>
                    <span style="color:var(--n-fg-disabled);">主题</span>
                </button>
                <!-- History (disabled) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:transparent; color:var(--n-fg-disabled); font-size:12px; font-weight:500; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><circle cx="7" cy="7" r="5.5" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><path d="M7 4v3.5h3" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/></svg>
                    <span style="color:var(--n-fg-disabled);">历史</span>
                </button>
                <!-- Export (disabled/ghosted) -->
                <button disabled style="height:28px; padding:0 8px; border-radius:var(--n-radius-md); background:var(--n-brand-disabled); color:var(--n-fg-onbrand); font-size:12px; font-weight:600; cursor:default; border:none; font-family:var(--n-font-sans); opacity:0.6;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M7 2v7M4.5 5.5 7 8l2.5-2.5" stroke="var(--n-fg-onbrand)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 10v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1" stroke="var(--n-fg-onbrand)" stroke-width="1.2" stroke-linecap="round"/></svg>
                    <span style="color:var(--n-fg-onbrand);">导出</span>
                </button>
            </div>

            <!-- Right: Settings / Help (ghosted) -->
            <div class="flex items-center gap-1 shrink-0 justify-end" style="width:320px;">
                <button disabled style="width:28px; height:28px; border-radius:var(--n-radius-md); background:transparent; cursor:default; border:none; opacity:0.6; display:flex; align-items:center; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><path d="M8 1.5v1.2M8 13.3v1.2M1.5 8h1.2M13.3 8h1.2M3.4 3.4l.85.85M11.75 11.75l.85.85M3.4 12.6l.85-.85M11.75 4.25l.85-.85" stroke="var(--n-fg-disabled)" stroke-width="1" stroke-linecap="round"/></svg>
                </button>
                <button disabled style="width:28px; height:28px; border-radius:var(--n-radius-md); background:transparent; cursor:default; border:none; opacity:0.6; display:flex; align-items:center; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="var(--n-fg-disabled)" stroke-width="1.2"/><path d="M8 5.5v-.01M8 8.5v3" stroke="var(--n-fg-disabled)" stroke-width="1.2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <!-- ═══════════ THREE-COLUMN BODY ═══════════ -->
        <div class="flex flex-1 overflow-hidden">

            <!-- ═══ LEFT PANEL (280px) — empty state ═══ -->
            <aside class="flex flex-col shrink-0 border-r overflow-hidden" style="width:280px; background: var(--n-bg-sidebar); border-color: var(--n-border-default);">
                <!-- Tab bar -->
                <div class="flex shrink-0 border-b" style="gap:0; border-color: var(--n-border-default); background: var(--n-bg-sidebar);">
                    <button disabled style="flex:1; height:36px; background:transparent; border:none; cursor:default; font-size:13px; font-weight:500; color:var(--n-fg-tertiary); font-family:var(--n-font-sans); padding:0; opacity:0.6;">来源</button>
                    <button disabled style="flex:1; height:36px; background:transparent; border:none; border-bottom:2px solid var(--n-fg-tertiary); cursor:default; font-size:13px; font-weight:500; color:var(--n-fg-tertiary); font-family:var(--n-font-sans); padding:0; opacity:0.6;">DOM 树</button>
                </div>

                <!-- Empty content area -->
                <div class="flex-1 flex items-center justify-center" style="padding:40px 20px;">
                    <span style="font-size:12px; color:var(--n-fg-tertiary); font-family:var(--n-font-sans); text-align:center; line-height:1.5;">还没有内容</span>
                </div>

                <!-- Bottom status bar -->
                <div class="shrink-0 flex items-center justify-between" style="height:28px; padding:0 12px; border-top:1px solid var(--n-border-default); font-size:11px; color:var(--n-fg-tertiary); font-family:var(--n-font-sans); background: var(--n-bg-sidebar);">
                    <div class="flex items-center gap-1.5">
                        <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--n-fg-tertiary); flex-shrink:0; opacity:0.5;"></span>
                        <span style="color:var(--n-fg-tertiary);">等待导入</span>
                    </div>
                    <span style="color:var(--n-fg-tertiary);">—</span>
                    <span style="color:var(--n-fg-tertiary);">—</span>
                </div>
            </aside>

            <!-- ═══ CENTER STAGE — empty state ═══ -->
            <section class="flex-1 flex items-center justify-center overflow-auto" style="background: var(--n-bg-canvas); padding:24px;">
                <div class="flex flex-col items-center" style="text-align:center;">
                    <!-- Large SVG illustration: dashed document icon (200x160 area) -->
                    <div style="width:200px; height:160px; display:flex; align-items:center; justify-content:center; margin-bottom:0;">
                        <svg width="80" height="96" viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Document body with dashed border (64x80 logical, centered in 80x96 viewBox) -->
                            <rect x="8" y="8" width="64" height="80" rx="4" stroke="var(--n-border-default)" stroke-width="2" stroke-dasharray="5 4"/>
                            <!-- Wavy lines inside representing text content -->
                            <path d="M20 30 Q26 26 32 30 T44 30 T56 30 T62 30" stroke="var(--n-border-default)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                            <path d="M20 42 Q26 38 32 42 T44 42 T56 42 T62 42" stroke="var(--n-border-default)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                            <path d="M20 54 Q26 50 32 54 T44 54 T52 54" stroke="var(--n-border-default)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                            <path d="M20 66 Q26 62 32 66 T44 66 T56 66 T62 66" stroke="var(--n-border-default)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                            <!-- Corner fold -->
                            <path d="M56 8 L56 24 L72 24" stroke="var(--n-border-default)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                    </div>

                    <!-- Title -->
                    <h1 style="font-size:20px; font-weight:600; color:var(--n-fg-default); font-family:var(--n-font-sans); line-height:1.4; margin:0;">拖入 HTML 文件，或粘贴代码开始</h1>

                    <!-- Subtitle -->
                    <p style="font-size:13px; color:var(--n-fg-secondary); font-family:var(--n-font-sans); line-height:1.6; max-width:420px; text-align:center; margin:12px 0 0 0;">支持导入 .html 文件，或从剪贴板粘贴源码。所有修改本地保存。</p>

                    <!-- Primary CTA button -->
                    <button style="height:36px; padding:0 20px; background:var(--n-brand); color:var(--n-fg-onbrand); border-radius:var(--n-radius-md); font-size:14px; font-weight:500; font-family:var(--n-font-sans); border:none; cursor:pointer; margin-top:28px; line-height:36px; transition:background var(--n-duration-fast) var(--n-ease);" onmouseenter="this.style.background='var(--n-brand-hover)'" onmouseleave="this.style.background='var(--n-brand)'" onmousedown="this.style.background='var(--n-brand-active)'" onmouseup="this.style.background='var(--n-brand-hover)'" onfocus="this.style.outline='2px solid var(--n-border-focus)';this.style.outlineOffset='2px'" onblur="this.style.outline='none'">导入 HTML</button>

                    <!-- Secondary link -->
                    <a href="#" style="font-size:13px; color:var(--n-fg-link); font-family:var(--n-font-sans); text-decoration:none; margin-top:14px; cursor:pointer; transition:text-decoration var(--n-duration-fast) var(--n-ease);" onmouseenter="this.style.textDecoration='underline'" onmouseleave="this.style.textDecoration='none'">粘贴源码</a>
                </div>
            </section>

            <!-- ═══ RIGHT PANEL (320px) — Inspector empty state ═══ -->
            <aside class="flex flex-col shrink-0 border-l overflow-y-auto" style="width:320px; background: var(--n-bg-sidebar); border-color: var(--n-border-default);">
                <!-- Inspector header -->
                <div class="shrink-0" style="padding:12px 16px; border-bottom:1px solid var(--n-border-default);">
                    <span style="font-size:12px; font-weight:600; color:var(--n-fg-secondary); font-family:var(--n-font-sans); text-transform:uppercase; letter-spacing:0.04em;">Inspector</span>
                </div>

                <!-- Empty placeholder -->
                <div class="flex-1 flex items-start justify-center" style="padding:40px 24px;">
