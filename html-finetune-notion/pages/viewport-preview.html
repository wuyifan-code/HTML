/* ════════════════════════════════════════════════════════════
   Notion-style brand CSS — html-finetune-notion
   ════════════════════════════════════════════════════════════ */

@theme inline {
  --color-n-bg-base:        #ffffff;
  --color-n-bg-elevated:    #ffffff;
  --color-n-bg-subtle:      #fbfbfa;
  --color-n-bg-hover:       #f1f1f0;
  --color-n-bg-sidebar:     #f7f6f3;
  --color-n-bg-canvas:      #f7f6f3;
  --color-n-bg-inverse:     #2f3437;
  --color-n-fg-default:     #37352f;
  --color-n-fg-secondary:   #787774;
  --color-n-fg-tertiary:    #9b9a97;
  --color-n-fg-disabled:    #c4c4c2;
  --color-n-fg-link:        #2383e2;
  --color-n-fg-onbrand:     #ffffff;
  --color-n-brand:          #2383e2;
  --color-n-brand-hover:    #1a72cf;
  --color-n-brand-active:   #1761b3;
  --color-n-brand-disabled: rgba(35, 131, 226, 0.40);
  --color-n-success:        #0f7b0f;
  --color-n-warning:        #cb912f;
  --color-n-danger:         #e03e3e;
  --color-n-border-default: #e9e9e7;
  --color-n-border-strong:  #d3d3d0;
  --color-n-border-focus:   rgba(35, 131, 226, 0.40);
  --color-n-ring-focus-out: rgba(35, 131, 226, 0.40);
  --n-radius-sm: 4px;
  --n-radius-md: 5px;
  --n-radius-lg: 6px;
  --n-ease: cubic-bezier(0.165, 0.84, 0.44, 1);
  --n-duration-fast: 120ms;
  --n-duration-base: 180ms;
  --n-duration-slow: 240ms;
}

:root {
  /* surface */
  --n-bg-base:        #ffffff;
  --n-bg-elevated:    #ffffff;
  --n-bg-subtle:      #fbfbfa;
  --n-bg-hover:       #f1f1f0;
  --n-bg-sidebar:     #f7f6f3;
  --n-bg-canvas:      #f7f6f3;
  --n-bg-inverse:     #2f3437;

  /* text */
  --n-fg-default:     #37352f;
  --n-fg-secondary:   #787774;
  --n-fg-tertiary:    #9b9a97;
  --n-fg-disabled:    #c4c4c2;
  --n-fg-link:        #2383e2;
  --n-fg-onbrand:     #ffffff;

  /* brand & accent */
  --n-brand:          #2383e2;
  --n-brand-hover:    #1a72cf;
  --n-brand-active:   #1761b3;
  --n-brand-disabled: rgba(35, 131, 226, 0.40);
  --n-success:        #0f7b0f;
  --n-warning:        #cb912f;
  --n-danger:         #e03e3e;

  /* border */
  --n-border-default: #e9e9e7;
  --n-border-strong:  #d3d3d0;
  --n-border-focus:   rgba(35, 131, 226, 0.40);

  /* radius */
  --n-radius-sm: 4px;
  --n-radius-md: 5px;
  --n-radius-lg: 6px;

  /* shadow */
  --n-shadow-card:    0 1px 3px rgba(15,15,15,0.04), 0 0 0 1px rgba(15,15,15,0.04);
  --n-shadow-pop:     0 4px 12px rgba(15,15,15,0.05), 0 0 0 1px rgba(15,15,15,0.04);
  --n-shadow-overlay: 0 12px 32px rgba(15,15,15,0.14), 0 3px 8px rgba(15,15,15,0.08);
  --n-ring-focus:     0 0 0 2px var(--n-bg-base), 0 0 0 4px var(--n-border-focus);

  /* font */
  --n-font-sans: "Inter", "Inter Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --n-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* motion */
  --n-ease:           cubic-bezier(0.165, 0.84, 0.44, 1);
  --n-duration-fast:  120ms;
  --n-duration-base:  180ms;
  --n-duration-slow:  240ms;
}

.dark {
  --n-bg-base:     #191919;
  --n-bg-elevated: #202020;
  --n-bg-subtle:   #252525;
  --n-bg-sidebar:  #202020;
  --n-bg-canvas:   #2c2c2c;
  --n-bg-inverse:  #e8e8e8;
  --n-fg-default:  rgba(255, 255, 255, 0.90);
  --n-fg-secondary:rgba(255, 255, 255, 0.66);
  --n-fg-tertiary: rgba(255, 255, 255, 0.45);
  --n-fg-disabled: rgba(255, 255, 255, 0.25);
  --n-fg-link:     #4dabf7;
  --n-fg-onbrand:  #191919;
  --n-brand:          #4dabf7;
  --n-brand-hover:    #5bb8ff;
  --n-brand-active:   #3d9be6;
  --n-brand-disabled: rgba(77, 171, 247, 0.35);
  --n-success:        #4caf50;
  --n-warning:        #f5c542;
  --n-danger:         #f44336;
  --n-border-default: rgba(255, 255, 255, 0.10);
  --n-border-strong:  rgba(255, 255, 255, 0.16);
  --n-border-focus:   rgba(77, 171, 247, 0.45);
  --n-shadow-card:    0 1px 3px rgba(0,0,0,0.40);
  --n-shadow-pop:     0 6px 16px rgba(0,0,0,0.50);
  --n-shadow-overlay: 0 12px 32px rgba(0,0,0,0.60);
  --n-ring-focus:     0 0 0 2px #191919, 0 0 0 4px rgba(77,171,247,0.45);
}

    </style>

    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--n-bg-base); color: var(--n-fg-default); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* Toolbar button hover effect */
      .tb-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        padding: 0 8px;
        border-radius: var(--n-radius-md);
        background: transparent;
        color: var(--n-fg-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        font-family: var(--n-font-sans);
        transition: background var(--n-duration-fast) var(--n-ease);
      }
      .tb-btn:hover {
        background: var(--n-bg-hover);
        border-color: var(--n-border-default);
      }
      .tb-btn:focus {
        outline: 2px solid var(--n-border-focus);
        outline-offset: -1px;
      }
      /* Viewport switcher segmented control */
      .vp-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 10px;
        background: transparent;
        color: var(--n-fg-secondary);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        font-family: var(--n-font-sans);
        transition: background var(--n-duration-fast) var(--n-ease), color var(--n-duration-fast) var(--n-ease);
      }
      .vp-btn.active {
        background: var(--n-bg-hover);
        color: var(--n-fg-default);
        border-radius: var(--n-radius-md);
      }
      .vp-btn:not(.active):hover {
        color: var(--n-fg-default);
      }
      .vp-btn:focus {
        outline: 2px solid var(--n-border-focus);
        outline-offset: -1px;
        border-radius: var(--n-radius-md);
      }
      /* Icon rail button */
      .rail-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        margin: 2px 6px;
        border-radius: var(--n-radius-md);
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--n-fg-secondary);
        transition: background var(--n-duration-fast) var(--n-ease), color var(--n-duration-fast) var(--n-ease);
      }
      .rail-btn:hover {
        background: var(--n-bg-hover);
        color: var(--n-fg-default);
      }
      .rail-btn.active {
        background: var(--n-bg-hover);
        color: var(--n-fg-default);
      }
      .rail-btn:focus {
        outline: 2px solid var(--n-border-focus);
        outline-offset: -1px;
      }
    </style>
</head>
